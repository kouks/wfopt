[inventory]
path = ""                 # empty = %LOCALAPPDATA%\AlecaFrame\lastData.dat
max_age_hours = 2

[wfm]
platform = "pc"
crossplay = true
language = "en"
ingame_name = ""          # for reading your public listings without logging in
user_agent = "wf-trade-optimizer/0.1 (local personal trade report tool)"
rps = 2.5
auction_rps = 0.067         # riven auction search: ~1 per 15 s, Cloudflare blocks faster use

[cache_ttl_minutes]
catalog = 10080           # also invalidated by /v2/versions
sets = 10080
statistics = 360
top_orders = 10
riven_catalog = 10080
riven_weekly = 1440       # DE's weekly riven trade stats
auctions = 1440            # riven searches are slow to fetch and prices move slowly

[pricing]
strategy = "balanced"     # quick | balanced | patient
undercut = 0
outlier_floor = 0.6
orderbook_min_plat = 8    # only fetch live /top orders for items whose stats-based value reaches this
suspect_median_min_copies = 100  # own this many copies and the median is cross-checked:
suspect_median_ratio = 0.5       # live sellers below this share of it -> median treated as fake sales

[valuation]
trade_cost_plat = 5
daily_trades = 0          # 0 = use your Mastery Rank from the inventory file
ducat_value_plat = 0.08
endo_value_per_1000 = 2.5
bulk_units_per_trade = 3
horizon_days = 7
share = 0.2
liquidity_ref = 5

[scope]
categories = ["prime", "arcane", "mod"]
arcane_ranked_copies_fusable = true
never_sell = []             # keep every copy, e.g. ["overextended", "Arcane Grace"]

[sync]                    # stretch goal
post_visible = true
manage_only_tool_orders = true
draft_max_age_minutes = 60  # `listings apply --yes` applies the dry-run draft if it is this fresh
